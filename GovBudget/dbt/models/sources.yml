version: 2
sources:
  - name: lake
    schema: main
    tables:
      - name: contracts
        description: "USAspending contract transactions, one hive partition per fiscal-year archive (fy=YYYY). filename=true exposes each row's part file so audit_award_duplicate_copies can name the file a retired copy came from (ROADMAP #133); no model selects it otherwise."
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/contracts/*/*.parquet', hive_partitioning=true, union_by_name=true, filename=true)"
      - name: assistance
        description: "USAspending assistance transactions, one hive partition per fiscal-year archive (fy=YYYY). filename=true: see contracts."
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/assistance/*/*.parquet', hive_partitioning=true, union_by_name=true, filename=true)"
      - name: subawards
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/subawards/*/*.parquet', hive_partitioning=true, union_by_name=true)"
      - name: mts_outlays
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/mts_outlays/*.parquet')"
      - name: jbook_budget_lines
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/jbooks/budget_lines.parquet')"
      - name: jbook_details
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/jbooks/details.parquet')"
      - name: jbook_documents
        description: "Downloaded J-book source documents (id, org, fiscal_year=edition, sha256, rel_path). All-varchar. Joined by fct_decade_series for workbook fact-id derivation."
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/jbooks/documents.parquet')"
      - name: jbook_narratives
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/jbooks/detail_narratives.parquet')"
      - name: jbook_awards
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/jbooks/budget_line_awards.parquet')"
      - name: jbook_award_adjudications
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/jbooks/award_adjudications.parquet')"
      - name: jbook_announcement_link_reviews
        description: "ROADMAP #110 (owner-delegated ruling 2026-09-25) and R-DEC-110 (controller, 2026-09-26): the recorded outcomes of the agent-reviewer + independent-adversarial-reviewer pass behind the announcement+lexicon links, backfilled into Postgres (migration 018, scripts/backfill_announcement_link_reviews.py) and written here by `jbooks export-facts`. One row per review record of one crosswalk link (award_piid, pe_bli, exhibit, fiscal_year — budget_line_awards' own key); a link reviewed more than once has several rows. Four kinds of record (record_kind): a wave-4 'verdict_pair' (one proposal in data/research/announcements/wave4_verdicts/, with the reviewer's verdict and, for a 'link', both adversarial lenses; the reviewer's 'weak'/'wrong' proposals are recorded too, adversarial 'not_run'), a wave 1-3 'survivor_list' entry (a pair in a wave's `surviving` list: the reviewer proposed it as a link and it survived the adversarial refuter — recorded as reviewer 'link', adversarial 'upheld'), a wave 1-2 'refutation_sample' entry (a proposed link the refuter refuted — reviewer 'link', adversarial 'refuted'; a sample of 40 per wave, the rest recorded only as counts), and — R-DEC-110b (controller, 2026-09-26) — a 'precision_sample' record: a held-out precision-study refutation (Postgres link_precision_samples, verdict 'refuted', rubric 'attribution'; reviewer 'link', adversarial 'refuted'), a verdict on the (award, PE) PAIR rather than on one announcement, attached by the backfill to the pair's rows under the method the sample drew (the link it judged). The first three kinds are the announcement pipeline's own wave 1-4 reviews. audit_link_grading keeps an announcement+lexicon link at high only when a pipeline record upholds it (reviewer 'link' AND adversarial 'upheld'), no pipeline record with reviewer 'weak'/'wrong' or adversarial 'refuted' targets the article the link's card cites, AND no precision_sample refutation is attached to it; otherwise it publishes at medium with the reason the records give ('precision_sample_refuted' only when the pipeline's records alone would keep it high). An 'incomplete' adversarial read is neither an uphold nor a refutation (R-DEC-INCOMPLETE); a precision_sample record is never an uphold. The grading restates its predicate from the verdict columns, never from the stringified `upholds`. All-varchar, like every jbooks parquet (booleans are 'True'/'False'). REQUIRED, not optional: unlike sam_entities (an extract behind an owner-minted key, absent on every machine) this file is produced by the pipeline's own export-facts step, so a missing file means export-facts predates the backfill and the build must stop — a fallback would silently demote every link instead. The accepted_values tests below fail the build on any value outside the contract vocabulary, so a vocabulary drift cannot read as 'not upheld'."
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/jbooks/announcement_link_reviews.parquet')"
        columns:
          - name: award_piid
            data_tests: [not_null]
          - name: pe_bli
            data_tests: [not_null]
          - name: exhibit
            data_tests: [not_null]
          - name: fiscal_year
            description: "The link's edition year, as budget_line_awards.fiscal_year (varchar here; compared as an integer)."
            data_tests: [not_null]
          - name: record_kind
            description: "Which record the row copies (R-DEC-110; migration 018): 'verdict_pair' — one wave-4 proposal from a wave4_verdicts file, carrying the reviewer's verdict and the adversarial lenses' outcome; 'survivor_list' — one entry of a wave 1-3 result file's `surviving` list, which records the reviewer's 'link' (with its reason) and the pair's survival of the adversarial refuter, per (award, PE) pair rather than per proposal; 'refutation_sample' — one entry of a wave 1-2 result file's `refutations_sample` (a proposed link the refuter refuted; a sample, not every refutation). /methodology/ discloses the granularity. A fourth kind is not the pipeline's: 'precision_sample' — R-DEC-110b (2026-09-26): one held-out precision-study verdict of 'refuted' (Postgres link_precision_samples), a judgment of the (award, PE) pair on program attribution, attached only to the pair's crosswalk rows under the method the sample drew (a pair whose drawn link was since replaced by another route gets no record). The grading reads the three pipeline kinds by their two verdicts alike; a precision_sample record only ever demotes the link it is attached to (it binds whatever article it names and is never an uphold), and precision_sample_rows_are_refutations fails the build on any precision_sample row that is not a refutation (R-DEC-110b admits the study's refutations only)."
            data_tests:
              - not_null
              - accepted_values:
                  values: ['verdict_pair', 'survivor_list', 'refutation_sample', 'precision_sample']
          - name: reviewer_verdict
            description: "The agent reviewer's verdict — the wave files' own vocabulary: 'link' (proposed; the only verdict the adversarial lenses were run on), 'weak', 'wrong' (wave-4 rejections, recorded with adversarial_verdict 'not_run'). survivor_list, refutation_sample and precision_sample rows are always 'link'."
            data_tests:
              - not_null
              - accepted_values:
                  values: ['link', 'weak', 'wrong']
          - name: adversarial_verdict
            description: "The independent adversarial pass: 'upheld' (every lens returned refuted=false; for a survivor_list row, the pair survived the wave's refuter), 'refuted' (a lens returned refuted=true; every refutation_sample row; every precision_sample row — the held-out study's two-lens attribution verdict refuted the pair), 'incomplete' (no lens refuted but one is missing or malformed — the wave-4 rubric counts it as refuted, and audit_link_grading never counts it as upholding), 'not_run' (no lens ran: a reviewer 'weak'/'wrong', or a 'link' no lens answered)."
            data_tests:
              - not_null
              - accepted_values:
                  values: ['upheld', 'refuted', 'incomplete', 'not_run']
              # R-DEC-110b admits the precision study's REFUTATIONS only: a
              # precision_sample row carrying anything else is a contract drift
              # (a confirmation backfilled by mistake) and stops the build
              # instead of being silently ignored by the grading.
              - accepted_values:
                  name: precision_sample_rows_are_refutations
                  values: ['refuted']
                  config:
                    where: "record_kind = 'precision_sample'"
          - name: adversarial_lenses_passed
            description: "How many of a verdict_pair's two refute lenses returned refuted=false (0-2). NULL on a survivor_list, refutation_sample or precision_sample row (those records carry no per-lens outcome) and on 'not_run' (no lens ran). Migration 018 enforces the NULL pattern by CHECK."
          - name: upholds
            description: "'True' exactly when reviewer_verdict = 'link' and adversarial_verdict = 'upheld' (migration 018 CHECK), stored so a Postgres predicate is one column. audit_link_grading does not read it; it restates the predicate from the two verdict columns."
          - name: article_id
            description: "The defense.gov contract-announcement article the record reviewed: a wave-4 proposal's own article_id, or — for a survivor_list / refutation_sample entry, which lists the pair and names no article — the article of the one packet that wave triaged for the pair (migration 018's article_source says which). NULL (or empty) when there is none to name (the wave's packets for the pair name none, or more than one); a record naming no article binds to the pair in audit_link_grading. A precision_sample record names none (the study judges the pair) and binds whatever this column says."
          - name: article_source
            description: "Where article_id came from: 'verdict_file' (a wave-4 proposal's own article) or 'wave_packet' (the one packet the wave triaged for a survivor_list / refutation_sample entry's pair). NULL exactly when article_id is NULL (migration 018 CHECK)."
          - name: record_index
            description: "A verdict_pair's paragraph index in the announcement it read, as the wave-4 verdict file records it. NULL on survivor_list, refutation_sample and precision_sample rows (they name no paragraph)."
          - name: entry_index
            description: "The record's position in its source file's list (a verdict file's proposals, or a result file's `surviving` / `refutations_sample` list); on a precision_sample row, the link_precision_samples row id. With the link key, source_file and record_kind it keys the row (migration 018 primary key)."
          - name: cites_reviewed_article
            description: "'True' when the link's award_link_sources row (the article its card cites) is the article this record reviewed, 'False' when it is another; NULL when the record names no article. Computed by the backfill from Postgres. audit_link_grading reads a pipeline contrary record (reviewer 'weak'/'wrong' or adversarial 'refuted') against the card only when this is 'True', or when the match is unknown (NULL with an article_id) or the record names no article; it does not read this column for a precision_sample record, which binds to the pair."
            data_tests:
              - accepted_values:
                  values: ['True', 'False']
          - name: reason
            description: "A survivor_list or refutation_sample entry's reason, verbatim from the wave result file; on a precision_sample row, 'drawn from the <method> tier of held-out precision sample <sample_id> (rubric attribution), judged refuted' followed by the adjudicator's reason (the tier the link was drawn from, which the export's precision tally reads). NULL on every verdict_pair row (migration 018 CHECK); a verdict pair's reasons stay in its verdict file."
          - name: reviewed_at
            description: "NULL on every backfilled row: the wave result and verdict files carry no review timestamp (the commit that recorded the wave-4 verdicts, 1c30122b of 2026-09-19, only bounds it, and a bound is not a review date). Kept so a future review that records its date has a column for it."
          - name: source_file
            description: "The wave result/verdict file the record was backfilled from (data/research/announcements/…), so each record traces to the file on disk; on a precision_sample row, the precision study's sample_id (the record traces to link_precision_samples by sample_id + entry_index)."
      - name: entity_xwalk_src
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/entities/entity_xwalk.parquet')"
      - name: sam_entities
        description: "SAM.gov Entity Management registrations for the dominant member of each published company family (ROADMAP #10). One row per ueiSAM; all-varchar. NOT an entity-resolution input: recipient_parent_name IS the SAM registration name, so this enriches a company page and never regrades a confidence tier. Written by `govbudget sam extract`. A zero-row file is valid and normal (the extract runs at 10 requests/day behind an owner-minted key), and so is NO FILE AT ALL: dim_entities reads this through the sam_entities_relation() macro, which substitutes a typed zero-row relation when the parquet is absent, so every sam_* column is NULL rather than the mart being unqueryable."
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/sam/entities.parquet')"
  - name: oversight
    schema: main
    tables:
      - name: improper_payments
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/oversight/improper_payments.parquet')"
      - name: high_risk
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/oversight/high_risk.parquet')"
  - name: influence
    schema: main
    tables:
      - name: lda_filings
        description: "LDA filings from Senate LDA REST API; one row per unique filing UUID. Income and expenses are mutually exclusive per filing (outside-firm vs in-house). All-varchar."
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/influence/lda_filings.parquet')"
      - name: lda_activities
        description: "LDA lobbying activities; one row per (filing_uuid, issue_code). agencies_json is JSON array of agency names. All-varchar."
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/influence/lda_activities.parquet')"
      - name: lda_lobbyists
        description: "LDA lobbyists; one row per (filing_uuid, name, covered_position) after deduplication within each filing. All-varchar."
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/influence/lda_lobbyists.parquet')"
      - name: lda_program_mentions
        description: "Deterministic program-mention matches from LDA activity descriptions. At most one row per (filing_uuid, pe_bli) (#52 evidence-tier fix — a single common title word is no longer sufficient to emit a row). evidence_kind is one of pe_literal | alias | multi_token. Citation-ready: filing_uuid resolves to filing URL. All-varchar."
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/influence/lda_program_mentions.parquet')"
  - name: states
    schema: main
    tables:
      - name: ca_budget
        description: "California budget lines from Open Fi$Cal per-department transaction files (all-varchar; FY2025)"
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/states/ca_budget.parquet')"
      - name: ca_checkbook
        description: "California Open Fi$Cal aggregated spend per department/category/year (all-varchar)"
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/states/ca_checkbook_agg.parquet')"
      - name: ct_checkbook
        description: "Connecticut OpenCheckbook aggregated spend per department/category/year from data.ct.gov Socrata (all-varchar; FY2019-2026)"
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/states/ct_checkbook_agg.parquet')"
      - name: state_population
        description: "US Census state population estimates (NST-EST2024); CA and CT included; all-varchar"
        meta:
          external_location: "read_parquet('{{ env_var('GOVBUDGET_DATA', 'data') }}/parquet/states/state_population.parquet')"
