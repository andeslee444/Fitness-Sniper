name: govbudget
version: "1.0"
profile: govbudget
model-paths: ["models"]
seed-paths: ["seeds"]
models:
  govbudget:
    +materialized: view
    marts:
      dim_recipients:
        +materialized: table
      # R-DEC-LINK-2026-10-21 R4: read by every link->award dollar join; a
      # table, so the award lake is resolved once per build, not once per mart
      link_award_keys:
        +materialized: table
seeds:
  govbudget:
    state_category_map:
      +column_types:
        jurisdiction: varchar
        raw_category: varchar
        comparable_category: varchar
        notes: varchar
    program_aliases:
      +column_types:
        alias: varchar
        pe_bli: varchar
        notes: varchar
    p1_era_code_decisions:
      +column_types:
        decision_id: varchar
        line_item_code: varchar
        account: varchar
        organization: varchar
        first_edition: varchar
        last_edition: varchar
        decision: varchar
        program_account: varchar
        program_org: varchar
        successor_code: varchar
        successor_account: varchar
        successor_evidence: varchar
        n_keys: varchar
        keys_sha256: varchar
        titles_seen: varchar
        modern_title: varchar
        proposed_rule: varchar
        evidence: varchar
        decided_on: varchar
        decided_by: varchar
        ruling: varchar
        note: varchar
    link_line_rulings:
      +column_types:
        award_piid: varchar
        pe_bli: varchar
        ruling: varchar
        species: varchar
        correct_line: varchar
        evidence: varchar
        ruled_on: varchar
        ruled_by: varchar
        ruling_id: varchar
    p1_route_safe_codes:
      +column_types:
        account: varchar
        line_item_code: varchar
        page_key: varchar
        exhibit_family: varchar
        decided_on: varchar
        decided_by: varchar
        note: varchar
