name: govbudget
version: "1.0"
profile: govbudget
model-paths: ["models"]
seed-paths: ["seeds"]
models:
  govbudget:
    +materialized: view
    marts:
      dim_recipients:
        +materialized: table
seeds:
  govbudget:
    state_category_map:
      +column_types:
        jurisdiction: varchar
        raw_category: varchar
        comparable_category: varchar
        notes: varchar
    program_aliases:
      +column_types:
        alias: varchar
        pe_bli: varchar
        notes: varchar
    p1_era_code_decisions:
      +column_types:
        decision_id: varchar
        line_item_code: varchar
        account: varchar
        organization: varchar
        first_edition: varchar
        last_edition: varchar
        decision: varchar
        program_account: varchar
        program_org: varchar
        successor_code: varchar
        successor_account: varchar
        successor_evidence: varchar
        n_keys: varchar
        keys_sha256: varchar
        titles_seen: varchar
        modern_title: varchar
        proposed_rule: varchar
        evidence: varchar
        decided_on: varchar
        decided_by: varchar
        ruling: varchar
        note: varchar
